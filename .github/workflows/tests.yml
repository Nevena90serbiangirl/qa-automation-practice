name: Python and Postman tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Newman
        run: npm install -g newman

      - name: Create artifacts folder
        run: mkdir -p artifacts

      - name: Run Python tests
        run: python -m pytest -v --junitxml=artifacts/junit-report.xml

      - name: Run Postman collection
        if: always()
        run: newman run Postman/qa-api-collection.json -r cli,junit --reporter-junit-export artifacts/postman-report.xml

      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-report
          path: artifacts/junit-report.xml
          if-no-files-found: warn

      - name: Upload Selenium screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-screenshots
          path: artifacts/*.png
          if-no-files-found: warn

      - name: Upload Postman test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postman-test-report
          path: artifacts/postman-report.xml
          if-no-files-found: warn